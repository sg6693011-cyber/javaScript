<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai aur code</title>
</head>
<body style="background-color: black; color: red;">
    <ul class="langauge">
        <li>javaScript</li>
    </ul>
</body>
<script>
    function addLangauge(langName){
        const li=document.createElement('li');
        li.innerHTML=`${langName}`
        document.querySelector('.langauge').appendChild(li);
    }
    addLangauge("python");
    addLangauge("typeScript");

    // use fxn in optimize way
    function addoptiLangauge(langName){
        const li=document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.langauge').appendChild(li)
    }
    addoptiLangauge('golang');

    // Edit
    const secondLang=document.querySelector("li:nth-child(2)");
    console.log(secondLang);
    // secondLang.innerrHTML="Mojo";
    const newli=document.createElement('li')
    newli.textContent="MOjO"
    secondLang.replaceWith(newli)

    // edit
    const firstLang=document.querySelector("li:first-child");
    firstLang.outerHTML='<li>TypeScript</li>'

    // remove
    const lastlang=document.querySelector('li:last-child')
    lastlang.remove()
</script>
</html>
