<!DOCTYPE html>

<head>

</head>
<body>
    <h1>Chai aur Code</h1>
    <button id="stop" style="background-color: black;color:red">Stop</button>
</body>
<script>
    const sayHitesh=function(){

    }
    const changeText=function(){
        document.querySelector('h1').innerHTML="best JS series"
    }
    const changeMe=setTimeout(changeText,2000)

        console.log("STOPPED");
    })
</script>
